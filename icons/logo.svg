<svg width="100%" viewBox="0 0 680 220" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Nail Stock logo</title>
<desc>Logo Nail Stock con texto cursivo y detalles decorativos</desc>

<defs>
  <style>
    .logo-title { font-family: Georgia, serif; font-size: 64px; font-weight: 400; font-style: italic; fill: #72243E; }
    .logo-sub { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.22em; fill: #C4A0AE; }
    @media (prefers-color-scheme: dark) {
      .logo-title { fill: #F4C0D1; }
      .logo-sub { fill: #9E7080; }
    }
  </style>
</defs>

<g transform="translate(148,42)" fill="#D4537E" opacity="0.85">
  <line x1="0" y1="-14" x2="0" y2="14" stroke="#D4537E" stroke-width="2" stroke-linecap="round"/>
  <line x1="-14" y1="0" x2="14" y2="0" stroke="#D4537E" stroke-width="2" stroke-linecap="round"/>
  <line x1="-9" y1="-9" x2="9" y2="9" stroke="#D4537E" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="9" y1="-9" x2="-9" y2="9" stroke="#D4537E" stroke-width="1.2" stroke-linecap="round"/>
</g>

<g transform="translate(530,38)" fill="#D4537E" opacity="0.5">
  <line x1="0" y1="-9" x2="0" y2="9" stroke="#D4537E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="-9" y1="0" x2="9" y2="0" stroke="#D4537E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="-6" y1="-6" x2="6" y2="6" stroke="#D4537E" stroke-width="1" stroke-linecap="round"/>
  <line x1="6" y1="-6" x2="-6" y2="6" stroke="#D4537E" stroke-width="1" stroke-linecap="round"/>
</g>

<circle cx="555" cy="68" r="4" fill="#F4C0D1" opacity="0.9"/>
<circle cx="130" cy="75" r="3" fill="#F4C0D1" opacity="0.7"/>

<g transform="translate(562,148)" opacity="0.45">
  <line x1="0" y1="-11" x2="0" y2="11" stroke="#D4537E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="-11" y1="0" x2="11" y2="0" stroke="#D4537E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="-7" y1="-7" x2="7" y2="7" stroke="#D4537E" stroke-width="1" stroke-linecap="round"/>
  <line x1="7" y1="-7" x2="-7" y2="7" stroke="#D4537E" stroke-width="1" stroke-linecap="round"/>
</g>

<text x="340" y="130" text-anchor="middle" class="logo-title">Nail Stock</text>
<rect x="200" y="148" width="280" height="1.5" rx="1" fill="#F4C0D1"/>
<text x="340" y="170" text-anchor="middle" class="logo-sub">GESTIÓN DE INVENTARIO</text>

</svg>
